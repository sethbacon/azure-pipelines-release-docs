# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# Documented, intentional exceptions. Every other finding fails the
# "Workflow Security / Zizmor (workflow security lint)" job, which is a
# required status check on main.
#
# Only self-repository is exempted. The cache-poisoning and
# superfluous-actions entries that stood here until 2026-09-23 were dead:
# both findings had been fixed AT SOURCE -- every setup-node step in
# release.yml carries `package-manager-cache: false`, and
# softprops/action-gh-release is no longer used at all -- so zizmor applied
# 2 of the 5 declared ignores and silently discarded the rest. Their
# line:column anchors had drifted onto unrelated lines (`contents: read`, a
# comment, a `package-manager-cache: false`, a `subject-path:` and a
# `cosign sign-blob`), which is where a genuinely new finding at one of
# those coordinates would have been swallowed. Verified with the command
# below on zizmor 1.30.1, the version the shared workflow pins:
# `--no-config` reports the two self-repository findings and nothing else.
#
# Re-verify with:
#   zizmor --no-config --format plain .github/workflows/
rules:
  # Full-SHA pinning was a convention with nothing enforcing it: the repository
  # setting `sha_pinning_required` is false, and zizmor's DEFAULT unpinned-uses
  # policy accepts a tag (`ref-pin`), so `actions/checkout@v7` would have passed
  # the required "Workflow Security / Zizmor (workflow security lint)" context
  # (#30). `hash-pin` for every owner makes zizmor itself reject it.
  # scripts/check-workflow-hardening.js asserts the same property from the other
  # side and is mutation-proved; two gates on one property is deliberate,
  # because this one can only be trusted as far as an upstream default.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  self-repository:
    ignore:
      # zizmor 1.30.0 wants the reusable-workflow call rewritten from
      # `uses: ./.github/workflows/ci.yml` to GitHub's self-repository form,
      # `uses: $/.github/workflows/ci.yml`. That remediation cannot be applied
      # here: actionlint rejects `$/` as a malformed `uses:` value, and
      # actionlint is a required check through 4cloudguru/shared-workflows'
      # workflow-security gate. This was proven, not assumed — the conversion
      # was tried in 4cloudguru/shared-workflows#46, `$/` resolved correctly at
      # runtime, and actionlint plus a pinning gate failed it. Support is
      # requested in rhysd/actionlint#711, still open. Tracked in
      # 4cloudguru/shared-workflows#45; drop this entry once actionlint accepts
      # the form. Scoped to the two files that call the reusable workflow, so
      # a `uses: ./` added anywhere else still fails the job.
      - release.yml
      - weekly-security.yml
