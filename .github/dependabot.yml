version: 2

# No `registries:` block: the shared primitives are @4cloudguru/pipeline-task-core
# and @4cloudguru/pipeline-task-ado, published to the PUBLIC npm registry, which
# needs no authentication. This previously pointed the npm updater at GitHub
# Packages with a SUITE_READ_TOKEN for a @sethbacon-scoped package that does not
# exist there; Dependabot resolves a missing secret to an empty string rather
# than failing, so that misconfiguration would have degraded silently.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Hold the compiler major in step with the sibling extensions
      # (azure-pipelines-terraform and -packer are both on TypeScript 5).
      # These three repos share copied task code, so a compiler-major split
      # is precisely the drift the shared-core initiative exists to remove.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
