version: 2

# No `registries:` block: the shared primitives are @4cloudguru/pipeline-task-core
# and @4cloudguru/pipeline-task-ado, published to the PUBLIC npm registry, which
# needs no authentication. This previously pointed the npm updater at GitHub
# Packages with a SUITE_READ_TOKEN for a @sethbacon-scoped package that does not
# exist there; Dependabot resolves a missing secret to an empty string rather
# than failing, so that misconfiguration would have degraded silently.

# COVERAGE IS GATED. scripts/check-dependabot-coverage.js runs in CI's required
# "Dependency audit" job and fails the build if a directory holding a task.json
# has no npm entry here, or if an npm entry names a directory that does not
# exist or holds no package.json. Tasks are independent npm packages with their
# own lockfiles and `directory: /` covers none of them, so on the day the first
# task lands this file has to grow an entry for it -- and CI says so on that
# pull request rather than leaving it to be remembered (#25).

# COOLDOWN. Every entry below sets `default-days: 7`. Dependabot's implicit
# default is 3, which is what zizmor's dependabot-cooldown audit reports as
# insufficient: a compromised release is usually yanked within days, and a
# version update that lands the hour it is published adopts it before anyone has
# looked. This delays VERSION updates only -- GitHub documents cooldown as not
# applying to SECURITY updates, so a patched advisory still arrives immediately.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    # codeql-action's init/analyze are separate Dependabot dependencies but are
    # version-locked at runtime, so they have to move in a single PR.
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Hold the compiler major in step with the sibling extensions
      # (azure-pipelines-terraform and -packer are both on TypeScript 5).
      # These three repos share copied task code, so a compiler-major split
      # is precisely the drift the shared-core initiative exists to remove.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # npm (.github/commit-message-check: the parser the PR gate shares with
  # release-please)
  # ---------------------------------------------------------------------------
  # The gate is only meaningful while it parses the way release-please does, so
  # these bumps want checking against release-please's own dependency rather
  # than merging on green.
  - package-ecosystem: npm
    directory: /.github/commit-message-check
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      commit-message-check:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # npm (per task) — each task is an independent package with its own lockfile,
  # so `directory: /` covers none of them. Required by
  # scripts/check-dependabot-coverage.js (#25).
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /Tasks/Markdown2Html/Markdown2HtmlV1
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      markdown2html-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /Tasks/PublishKbArticle/PublishKbArticleV1
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      publishkbarticle-dependencies:
        patterns:
          - "*"
