---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The package-composition gate lives in THIS job on purpose. There is no
  # workflow that builds or publishes a .vsix (package:* and build:release exist
  # in package.json and nothing in .github/ invokes them), so a composition check
  # attached to a publish job would never run. And 'Check Version Consistency' is
  # already a required status check on main, so adding steps here makes the new
  # gate merge-blocking on the day it lands rather than on the day someone
  # remembers to add a context to branch protection. Every step below is
  # dependency-free node, which is why this job still needs no npm ci.
  manifest:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Version and manifest invariants
        run: node scripts/check-versions.js
      - name: Package composition
        run: node scripts/check-package-composition.js
      # Mutation self-test: re-creates each defect the gates exist to catch and
      # asserts the gate exits non-zero AND names the cause. A gate that has
      # quietly stopped detecting anything looks exactly like a clean tree, so
      # this runs beside it on every PR rather than once at review time.
      - name: Composition gates detect what they claim to
        run: node scripts/test-package-composition.js

  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run deps
      - run: npm run compile
      - run: npm run test:all

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  zizmor:
    name: Scan Workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
