---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # workflow_call is LOAD-BEARING, not leftover. release.yml's `ci` job calls
  # this file (`uses: ./.github/workflows/ci.yml`), which is why release.yml
  # narrowed its dispatch trigger instead of threading a ref: the hook declares
  # no inputs, so the called workflow tests whatever ref the run started from.
  # It was recorded as an unused entry point (#36) against the commit before
  # that release path landed. Declaring `inputs:`/`secrets:` here is a change to
  # release.yml's dispatch rule as well as to this file.
  workflow_call: {}
  # Manual reruns. Write-access-gated, and no in-repo caller by design.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The package-composition gate lives in THIS job on purpose. There is no
  # workflow that builds or publishes a .vsix (package:* and build:release exist
  # in package.json and nothing in .github/ invokes them), so a composition check
  # attached to a publish job would never run. And 'Check Version Consistency' is
  # already a required status check on main, so adding steps here makes the new
  # gate merge-blocking on the day it lands rather than on the day someone
  # remembers to add a context to branch protection. Every step below is
  # dependency-free node, which is why this job still needs no npm ci.
  manifest:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job holds no stored credential and
      # runs dependency-free node against the checked-out tree; there is nothing here
      # worth exfiltrating and its egress is the runner's own action and toolchain
      # fetches. The two jobs in this repository that DO hold a stored App private
      # key — release-please and signature-replay's replay — are on `block` with an
      # explicit allowlist (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Task versions are compared against the SAME task at the base
          # revision (#44), which needs the base commit to be in the object
          # store. A shallow checkout has only the merge commit, so `git show
          # <base>:Tasks/.../task.json` would fail and check-versions.js fails
          # closed rather than skipping the comparison.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Version and manifest invariants
        env:
          # On a pull_request the checkout is the merge ref and origin/main is
          # not fetched, so name the base explicitly; on a push it is the commit
          # main was at before. check-versions.js falls back to origin/main then
          # HEAD^ and FAILS if none resolves while tasks exist.
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-versions.js
      - name: Package composition
        run: node scripts/check-package-composition.js
      # Also run at release time, in release.yml's guard. Here as well because a
      # precondition only checked at release time is discovered BY the release:
      # the per-task SBOM gap of #83 arrived with the tasks in #71 and sat on a
      # green main until a tag would have hit the guard.
      - name: Release preconditions
        run: node scripts/check-release-readiness.js
      # Mutation self-tests: each re-creates the defects the gates exist to catch
      # and asserts the gate exits non-zero AND names the cause. A gate that has
      # quietly stopped detecting anything looks exactly like a clean tree, so
      # these run beside it on every PR rather than once at review time.
      - name: Composition gates detect what they claim to
        run: node scripts/test-package-composition.js
      - name: Version, universe, publish-identity and audit-scope gates detect what they claim to
        run: node scripts/test-gates.js
      # The class signatures, run here as well as by security-orchestration's
      # replay, so this repository and the replay cannot answer differently about
      # the same code. They arrived with the tasks and were wired into nothing:
      # the replay skips this repo while its kind is `ado-extension-scaffold`, so
      # until now they ran NOWHERE. Same four the sibling extensions run in CI;
      # check-artifact-trust and auth-parity-matrix are replay-only there too.
      - name: Egress authorization (SSRF class signature)
        run: node scripts/check-egress-authorization.js
      - name: Enforced disciplines (documented-but-unenforced class signature)
        run: node scripts/check-enforced-disciplines.js
      - name: Self-test check-enforced-disciplines.js
        run: node scripts/test-check-enforced-disciplines.js
      - name: Outbound proxy parity (packer #196 class signature)
        run: node scripts/check-proxy-parity.js
      - name: Shared-module parity (byte-identity across both tasks)
        run: node scripts/check-shared-modules.js

  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      # hardening-exception: egress-audit — this job runs `npm ci` and the per-task
      # install/compile/test path, so its egress is npm's registry and CDN redirects
      # rather than a set this file can enumerate; an allowlist here would be a guess
      # that breaks a required check on a CDN change. It holds no stored credential.
      # Same call 4cloudguru/cloud-suite-ui's publish.yml makes, and for the same
      # stated reason (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # Before `npm run deps`, deliberately. It executes the real npm() against
      # the real npm, so a resolution order that is wrong for a Windows runner
      # fails on the pull request that writes it rather than in a release (#45).
      - run: npm run test:task-runner
      - run: npm run deps
      - run: npm run compile
      - run: npm run test:all
      # Both task.json files declare a Node20_1 handler beside Node24, so an agent
      # without Node 24 runs the shipped artefact under Node 20 — a runtime nothing
      # here executed until this leg. azure-pipelines-terraform smoke-tested these
      # same two tasks that way before they moved (its #654).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm run smoke:all

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — `npm audit` posts the resolved tree to
      # the registry's advisory endpoint and `npm ci` resolves through its CDN, so
      # the destination set belongs to npm rather than to this file. No stored
      # credential is present in this job (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Dependency-free: reads package-lock.json and the workflows only, so it
      # runs before any install and cannot be defeated by one.
      - name: The audited tree is not empty
        run: node scripts/check-audit-scope.js
      # Auditing a tree and updating it are two controls with the same scope
      # problem, so they are checked in the same required job. Dependabot's npm
      # updater reads only the directories .github/dependabot.yml names, and
      # `directory: /` stops at the root package.json; a task's lockfile would
      # be watched by nothing on the day it lands (#25). Also dependency-free,
      # and mutation-proved by scripts/test-gates.js in the manifest job.
      - name: Every task's lockfile is enumerated for updates
        run: node scripts/check-dependabot-coverage.js
      - run: npm ci --ignore-scripts
      # No --omit=dev. package.json declares no `dependencies`, so --omit=dev
      # audited an empty tree while this context reported green on main (#20).
      # The excluded packages are the toolchain that builds and packages the
      # .vsix, tfx-cli included.
      - run: npm audit --audit-level=high
      # The root lockfile resolves the root's own tooling only. Tasks are
      # independent npm packages with their own lockfiles, so this is the only
      # thing that ever audits them (#54). It enumerates zero today and says so.
      - run: npm run audit:all

  # Both linters, and the durable record of what they find, come from the shared
  # definition rather than being maintained here. The local pair did the same two
  # passes for the same reason -- one call cannot both record and block -- but as
  # a shape this repository had to keep correct on its own while two sibling
  # extensions kept their own.
  workflow-security:
    name: Workflow Security
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-security.yml@9ed6d3c988fb075f1023680d92eb4cf5a8e55056 # v1.14.0

  # The recording half is a SEPARATE workflow because a job requesting
  # security-events: write is validated when the run is created, before `if:` is
  # evaluated -- so an opt-in flag inside the other file would fail every caller
  # that does not grant it, at startup, producing no jobs at all. The permission
  # is granted here because this is the only place it can be.
  workflow-security-record:
    name: Workflow Security Record
    permissions:
      contents: read
      security-events: write
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-security-record.yml@9ed6d3c988fb075f1023680d92eb4cf5a8e55056 # v1.14.0

  docs-claims:
    name: Check Documented Claims
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job holds no stored credential and
      # runs one dependency-free node script over the checked-out documents; its
      # egress is the runner's own action and toolchain fetches (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # No install step: the script uses node builtins and `git check-ignore`
      # only, so it runs before and independently of any dependency tree.
      - run: node scripts/check-docs-claims.js

  # zizmor scans for workflow SECURITY anti-patterns; it does not check workflow
  # schema, expression syntax or the shell inside `run:`. The workflows ARE this
  # repository's production artifact today — there is no task code — so the
  # complementary linter the family already runs as a required check in
  # azure-pipelines-terraform belongs here too (#56).
  #
  # A NEW required context has to be added to main's branch protection by hand:
  # "Lint GitHub Actions". Until that is done this job reports on every pull
  # request without blocking one. It is deliberately not a step on `manifest`:
  # a workflow-syntax failure reported under the context name "Check Version
  # Consistency" is the same misdirection #44 filed against that job.