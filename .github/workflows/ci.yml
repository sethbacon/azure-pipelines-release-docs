---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # workflow_call is LOAD-BEARING, not leftover. release.yml's `ci` job calls
  # this file (`uses: ./.github/workflows/ci.yml`), which is why release.yml
  # narrowed its dispatch trigger instead of threading a ref: the hook declares
  # no inputs, so the called workflow tests whatever ref the run started from.
  # It was recorded as an unused entry point (#36) against the commit before
  # that release path landed. Declaring `inputs:`/`secrets:` here is a change to
  # release.yml's dispatch rule as well as to this file.
  workflow_call: {}
  # Manual reruns. Write-access-gated, and no in-repo caller by design.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The package-composition gate lives in THIS job on purpose. There is no
  # workflow that builds or publishes a .vsix (package:* and build:release exist
  # in package.json and nothing in .github/ invokes them), so a composition check
  # attached to a publish job would never run. And 'Check Version Consistency' is
  # already a required status check on main, so adding steps here makes the new
  # gate merge-blocking on the day it lands rather than on the day someone
  # remembers to add a context to branch protection. Every step below is
  # dependency-free node, which is why this job still needs no npm ci.
  manifest:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job holds no stored credential and
      # runs dependency-free node against the checked-out tree; there is nothing here
      # worth exfiltrating and its egress is the runner's own action and toolchain
      # fetches. The two jobs in this repository that DO hold a stored App private
      # key — release-please and signature-replay's replay — are on `block` with an
      # explicit allowlist (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Task versions are compared against the SAME task at the base
          # revision (#44), which needs the base commit to be in the object
          # store. A shallow checkout has only the merge commit, so `git show
          # <base>:Tasks/.../task.json` would fail and check-versions.js fails
          # closed rather than skipping the comparison.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Version and manifest invariants
        env:
          # On a pull_request the checkout is the merge ref and origin/main is
          # not fetched, so name the base explicitly; on a push it is the commit
          # main was at before. check-versions.js falls back to origin/main then
          # HEAD^ and FAILS if none resolves while tasks exist.
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-versions.js
      - name: Package composition
        run: node scripts/check-package-composition.js
      # Mutation self-tests: each re-creates the defects the gates exist to catch
      # and asserts the gate exits non-zero AND names the cause. A gate that has
      # quietly stopped detecting anything looks exactly like a clean tree, so
      # these run beside it on every PR rather than once at review time.
      - name: Composition gates detect what they claim to
        run: node scripts/test-package-composition.js
      - name: Version, universe, publish-identity and audit-scope gates detect what they claim to
        run: node scripts/test-gates.js

  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      # hardening-exception: egress-audit — this job runs `npm ci` and the per-task
      # install/compile/test path, so its egress is npm's registry and CDN redirects
      # rather than a set this file can enumerate; an allowlist here would be a guess
      # that breaks a required check on a CDN change. It holds no stored credential.
      # Same call 4cloudguru/cloud-suite-ui's publish.yml makes, and for the same
      # stated reason (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # Before `npm run deps`, deliberately. This is the only self-test in the
      # repository that runs on BOTH matrix legs, because the property it proves
      # is platform-specific: for-each-task.js spawns npm, `Tasks/` is empty, so
      # that spawn has been called zero times on either leg and the
      # windows-2025 context has been green over a code path it never executed
      # (#45). It executes the real npm() against the real npm, so a resolution
      # order that is wrong for a Windows runner fails on the pull request that
      # writes it rather than on the day the first task lands.
      - run: npm run test:task-runner
      - run: npm run deps
      - run: npm run compile
      - run: npm run test:all

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — `npm audit` posts the resolved tree to
      # the registry's advisory endpoint and `npm ci` resolves through its CDN, so
      # the destination set belongs to npm rather than to this file. No stored
      # credential is present in this job (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Dependency-free: reads package-lock.json and the workflows only, so it
      # runs before any install and cannot be defeated by one.
      - name: The audited tree is not empty
        run: node scripts/check-audit-scope.js
      # Auditing a tree and updating it are two controls with the same scope
      # problem, so they are checked in the same required job. Dependabot's npm
      # updater reads only the directories .github/dependabot.yml names, and
      # `directory: /` stops at the root package.json; a task's lockfile would
      # be watched by nothing on the day it lands (#25). Also dependency-free,
      # and mutation-proved by scripts/test-gates.js in the manifest job.
      - name: Every task's lockfile is enumerated for updates
        run: node scripts/check-dependabot-coverage.js
      - run: npm ci --ignore-scripts
      # No --omit=dev. package.json declares no `dependencies`, so --omit=dev
      # audited an empty tree while this context reported green on main (#20).
      # The excluded packages are the toolchain that builds and packages the
      # .vsix, tfx-cli included.
      - run: npm audit --audit-level=high
      # The root lockfile resolves the root's own tooling only. Tasks are
      # independent npm packages with their own lockfiles, so this is the only
      # thing that ever audits them (#54). It enumerates zero today and says so.
      - run: npm run audit:all

  zizmor:
    name: Scan Workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # hardening-exception: egress-audit — the action fetches its own release
      # binary and uploads SARIF to the code-scanning API; both destinations are
      # upstream's to change and not this file's to enumerate. No stored credential
      # is present in this job (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # An explicit threshold rather than whatever the action defaults to. The
      # step carried no `with:` block at all, so what this required check would
      # and would not fail on was an upstream decision this repository had not
      # made (#30). `unknown` for both filters is zizmor's own no-filtering
      # setting: everything it finds fails the job, which is what it was already
      # doing and is now stated. .github/zizmor.yml carries the policy — every
      # `uses:` must be hash-pinned — and the two documented, line-scoped
      # exceptions.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          persona: regular
          min-severity: unknown
          min-confidence: unknown
          online-audits: true

  # A job of its own rather than another step on `manifest`. Steps bolted onto
  # `manifest` inherit its already-required status check and so block a merge on
  # the day they land, which is the stronger property — but that context is named
  # "Check Version Consistency", and a documentation gate reporting a failure
  # under that name is the same kind of inaccuracy this job exists to catch (the
  # name is already a poor fit for what the job does: #44). So: an honestly named
  # context, and one repository-settings change to make it blocking — add
  # "Check Documented Claims" to main's required status checks. Until that is
  # done this job reports on every pull request without blocking one.
  #
  # Documents are the only thing this repository currently ships, and the one
  # class of defect it has already had is a document asserting a control that
  # does not exist: SECURITY.md claimed a signed, SBOM-attested package behind an
  # approval gate when no workflow did any of the three. README.md was corrected
  # for the same drift months earlier and SECURITY.md was not, because nothing
  # compared either of them to the workflows. This job does.
  docs-claims:
    name: Check Documented Claims
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job holds no stored credential and
      # runs one dependency-free node script over the checked-out documents; its
      # egress is the runner's own action and toolchain fetches (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # No install step: the script uses node builtins and `git check-ignore`
      # only, so it runs before and independently of any dependency tree.
      - run: node scripts/check-docs-claims.js

  # zizmor scans for workflow SECURITY anti-patterns; it does not check workflow
  # schema, expression syntax or the shell inside `run:`. The workflows ARE this
  # repository's production artifact today — there is no task code — so the
  # complementary linter the family already runs as a required check in
  # azure-pipelines-terraform belongs here too (#56).
  #
  # A NEW required context has to be added to main's branch protection by hand:
  # "Lint GitHub Actions". Until that is done this job reports on every pull
  # request without blocking one. It is deliberately not a step on `manifest`:
  # a workflow-syntax failure reported under the context name "Check Version
  # Consistency" is the same misdirection #44 filed against that job.
  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job downloads one pinned release
      # asset and verifies it against a committed SHA256 before extracting, which is
      # an integrity control rather than an egress one; it holds no stored
      # credential (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        shell: bash
        # The release asset is downloaded directly and verified against
        # actionlint's own published SHA256 before extraction, rather than the
        # convenience install script, which pipes curl straight into tar with no
        # integrity check. Same version and checksum as the sibling extension's
        # required `Lint GitHub Actions` job. Checksum from
        # https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
        # (linux_amd64, matching this job's ubuntu-latest runner).
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
      - name: Run actionlint
        run: ./actionlint -color
      # Same contract as the node gates' self-tests: prove the linter still
      # rejects something before believing its green. The fixture lives outside
      # the repository so the run above never sees it, and it carries a defect
      # zizmor does not look for — an unknown runner label.
      - name: actionlint detects a broken workflow
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/.github/workflows"
          cat > "$work/.github/workflows/broken.yml" <<'YAML'
          name: broken
          on: push
          jobs:
            broken:
              runs-on: ubunut-latest
              steps:
                - run: echo hello
          YAML
          if ./actionlint -no-color "$work/.github/workflows/broken.yml"; then
            echo "actionlint accepted a workflow it should have rejected — this gate proves nothing"
            exit 1
          fi
          echo "actionlint rejected the broken fixture, as a working linter must"

      # ── The hardening properties actionlint and zizmor do not check ────────
      # Four findings landed on the same day saying the same thing about this
      # tree: full-SHA pinning (#30), harden-runner coverage (#22), a non-audit
      # egress policy (#23) and `--ignore-scripts` on every install (#21) were
      # all true and all unenforced. This gate is where they stop being
      # conventions. It lives HERE rather than on `manifest` because it is a
      # statement about workflows, and a workflow failure reported under the
      # context name "Check Version Consistency" is the misdirection #44 filed
      # against that job. "Lint GitHub Actions" is already a required context,
      # so the gate blocks a merge on the day it lands.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Workflow hardening invariants
        run: node scripts/check-workflow-hardening.js
      # Same contract as every other gate in this repository: break the thing
      # the gate protects and watch it fail BY NAME, beside the gate, on every
      # pull request. A gate that has quietly stopped detecting anything looks
      # exactly like a clean tree.
      - name: Workflow-hardening gate detects what it claims to
        run: node scripts/test-workflow-hardening.js

      # ── The one guard that is a shell script inside YAML ───────────────────
      # pr-checks.yml's "Breaking-change footers survive the squash" job is a
      # bash script embedded in a workflow: actionlint checks its syntax, zizmor
      # checks the workflow around it, and nothing runs it. It was ported from
      # terraform-registry-backend, where it has never had a test, so a regex
      # edit or a lost `set -euo pipefail` would leave a green context asserting
      # nothing (#49). This EXTRACTS the script from the workflow and runs it
      # against fixture commit histories with `gh` stubbed — here, in the
      # workflow-shaped job, because that is what it is a statement about.
      #
      # The `set -euo pipefail` half of that sentence was aspirational until the
      # `gh-unavailable` case: every fixture used a `gh` that succeeds, so no
      # case could tell a guard that fails closed from one that does not. The
      # stub that exits non-zero is what makes the claim true.
      - name: Breaking-change footer guard detects what it claims to
        run: node scripts/test-breaking-change-footers.js
