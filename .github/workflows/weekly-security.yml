---
name: Weekly Security Scan

# The layer that runs when no pull request and no release is in flight.
#
# Everything else in this repository is triggered by a change: CI on a pull
# request, release.yml on a tag. Nothing was watching the intervals between
# them, and dependency risk does not arrive on a change — an advisory published
# on a Tuesday makes a tree that was clean on Monday vulnerable without a commit
# (#58). The sibling extensions have run a weekly-security.yml for months; this
# is the release-docs port.
#
# TWO JOBS, AND WHAT WAS DELIBERATELY NOT PORTED.
#
#   ci      re-runs the whole of ci.yml against main with nothing in flight.
#           That is the drift canary: `npm audit` re-evaluated against advisories
#           published since the last merge, actionlint's pinned release asset
#           still being downloadable at the URL and checksum committed here, the
#           gate self-tests still passing on an unchanged tree. A required
#           context that has quietly stopped working looks exactly like one that
#           has nothing to report, and on a repository that can go weeks between
#           pull requests the difference matters.
#
#   osv-scan is broader advisory coverage than `npm audit`, which sees only what
#           the npm registry's own advisory database carries.
#
# NOT ported from the siblings, each for a stated reason rather than an
# oversight:
#
#   * The stale-Dependabot-PR labeller. It ends in `|| true`, so on a repository
#     without a `stale-security-patch` label it fails silently and reports
#     success — a canary that cannot chirp. If that label is created here, port
#     it then.
#   * A standalone "create an issue on failure" job covering the whole
#     workflow. When this file was first written there was no issue-filing
#     anywhere in it, because issue-filing needs `security` and `dependencies`
#     labels this repository did not carry then. It carries both now, and
#     `osv-scan` below files against them — a finding opens (or comments on) a
#     tracking issue instead of only reddening Monday, which is what the
#     2026-09-07 scheduled run showed was needed: it failed at "Run
#     OSV-Scanner" with exit 1 and notified nobody who was not already reading
#     run histories. What is still not ported is the WORKFLOW-WIDE version:
#     `ci` and `cross-repo-parity` notify by failing, as before. The osv job
#     can do better than they can because the shared action it now calls
#     reports whether the scanner found something or merely broke; the other
#     two have no such signal to file on.
#   * A marketplace-environment-protection canary. `scripts/check-release-
#     readiness.js` deliberately FAILS today — `azure-devops-extension.json`
#     declares no contributions, so there is nothing publishable — and a check
#     that is red every Monday by design teaches everyone to ignore Monday.
#     It becomes worth scheduling on the day the first task lands.

"on":
  schedule:
    # Monday 08:00 UTC, matching the siblings so the family's weekly results
    # land together.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The drift canary. A reusable-workflow call carries no steps and no
  # timeout-minutes of its own; ci.yml's jobs carry theirs.
  ci:
    name: CI
    # ci.yml's zizmor job uploads SARIF, so the called workflow needs more than
    # this workflow's default `contents: read`. A called workflow can only ever
    # narrow what the caller grants, so the caller has to grant it here — the
    # same reason, and the same block, as release.yml's `ci` job.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  # ── OSV-Scanner ───────────────────────────────────────────────────────────
  # WHAT THE SHA PIN COVERS. This changed on 2026-09-09, and the history is
  # kept rather than replaced: what follows used to be a stated, accepted
  # limitation, and a reader who finds only the current state cannot tell
  # whether it was ever thought about.
  #
  # UNTIL 2026-09-09 this job called `google/osv-scanner-action/osv-scanner-
  # action` directly. That is a DOCKER action: the action.yml a SHA pins is
  # four lines of metadata whose only substantive content is
  #
  #     runs:
  #       using: "docker"
  #       image: "docker://ghcr.io/google/osv-scanner-action:v2.5.1"
  #
  # — a MUTABLE TAG on a registry this repository does not control. The pin
  # fixed which action.yml ran and NOT which scanner binary ran: whoever could
  # push that ghcr tag replaced the code executing in this job, and neither the
  # pin, nor Dependabot, nor this repository's own full-SHA gate would have
  # seen it. `sethbacon/azure-pipelines-packer#261` moved that action
  # 2.3.8 -> 2.5.0 with none of it said anywhere, which is how a limitation
  # gets inherited instead of accepted. It was accepted here, with a date, in
  # SECURITY.md's residual risks, because the image reference lived INSIDE the
  # third-party action and there was nothing this repository could pass to pin
  # it.
  #
  # THAT REASON NO LONGER HOLDS. The estate's shared `osv-scan` action takes
  # the image as an input and defaults it to a DIGEST — v2.5.1 at
  # sha256:dcd947131d8d11b8d0964de6590661fb921a4ecbd7b90a7cb21083acfc3fd8cc —
  # so the scanner that runs is fixed by content rather than by a tag someone
  # else can re-point, and pinning that action by SHA now pins the scanner too.
  # That is what #58 asked for, arriving as the family's shared layer rather
  # than a divergent local one, which is why the checksum-verified binary
  # download described as the alternative was never built here.
  #
  # THE SECOND THING IT FIXES is why the 2026-09-07 run was useless. The
  # official action gives its caller one bit — the step passed or it did not —
  # so a scan that found something and a scanner that had stopped working are
  # the same red, and neither can be acted on differently. That run failed at
  # "Run OSV-Scanner" with exit 1, over three real adm-zip rows and two qs
  # rows, and filed nothing. The shared action reports the real exit code and
  # separates `findings` from `errored`, so this job files an issue for a
  # finding and fails outright for a broken scanner. Findings no longer redden
  # Monday; they open a ticket.
  #
  # What still bounds this job either way: scheduled rather than
  # merge-blocking, `contents: read` plus the one `issues: write` the filing
  # step needs, and no stored credential.
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — this job holds no stored credential
      # and its egress is a container pull from ghcr plus the scanner's own
      # queries to the OSV API, a destination set that belongs to upstream
      # rather than to this file. The two jobs in this repository that DO hold a
      # stored App private key — release-please and signature-replay's replay —
      # also run `audit` today (their first execution here, no baseline to block
      # from yet); that policy lives in the pinned 4cloudguru/shared-workflows
      # commit they delegate to, self-checked against drift by
      # scripts/check-shared-workflow-egress.js (#23).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # THE SHARED ACTION, NOT THE OFFICIAL ONE, AND STILL NO
      # `continue-on-error:` — for a different reason than before.
      #
      # `continue-on-error` was never used here, and the note that used to sit
      # on this step explained why: it rewrites a failed step's `conclusion` to
      # `success`, so a scanner that had stopped working produced exactly the
      # same green as one that ran and found nothing. That was the right call
      # and it left this job with the opposite defect — a finding, which is not
      # a failure, still failed the run, and nothing downstream could tell the
      # two apart to do anything about either.
      #
      # The shared action resolves both. It runs the scanner in a
      # digest-pinned image, reports the exit code it ACTUALLY got, and
      # publishes it as `outputs.exit-code`, `outputs.findings` and
      # `outputs.errored`. Findings do not fail this step; the step below reads
      # `findings` and files. A scanner ERROR — any exit that is neither 0 nor
      # 1 — still fails the job immediately, which is the one case where red is
      # the correct signal, because a scan that did not complete says nothing
      # about the tree.
      - name: Run OSV-Scanner
        id: osv
        uses: 4cloudguru/shared-workflows/.github/actions/osv-scan@6cc136d063217a077fc5183595adf26b21626a82 # v1.26.0
        with:
          scan-args: |-
            --recursive
            .
            --format=table
            --output=osv-results.txt

      # Runs even when the scan step failed, so the report is readable in the
      # run's Summary tab rather than only in the step log. `always()` now
      # covers the scanner-error case specifically: findings do not fail the
      # step above any more, so the only way to get here after a failure is a
      # scan that did not complete — and an empty report then means "nothing
      # was scanned", not "nothing was found", which is what the exit code
      # printed by the shared action's own summary block says.
      - name: Publish OSV results to the job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## OSV-Scanner results'
            echo
            if [ -s osv-results.txt ]; then
              echo '```'
              cat osv-results.txt
              echo '```'
            else
              echo 'No known vulnerabilities found in the scanned lockfiles.'
            fi
            echo
            # No backticks in these lines: shellcheck reads a backtick pair
            # inside a single-quoted string as an unexpanded command
            # substitution (SC2016) and actionlint runs shellcheck over every
            # `run:` block, so prose punctuation fails a required context.
            echo 'Scanned by the shared osv-scan action, which runs a digest-pinned scanner image, so'
            echo 'the SHA pin on that action covers the scanner itself and not only its metadata. The'
            echo 'suppressions filtering this report are the per-task osv-scanner.toml files; the'
            echo 'reasoning for each is in the residual risks in SECURITY.md.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Findings open a ticket instead of only reddening Monday. Gated on
      # `findings`, not on the step's outcome: a scanner ERROR fails the step
      # above and must not file a vulnerability issue about a scan that never
      # ran.
      - name: Create issue on new vulnerabilities
        if: steps.osv.outputs.findings == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Comment on the existing tracking issue instead of filing a new
            // one each Monday -- an unremediated finding otherwise buries any
            // genuinely new one under duplicates. Matched on a stable title
            // PREFIX (the full title also embeds today's date) plus both
            // labels, so only a prior OSV-Scanner issue is ever matched.
            const titlePrefix = 'OSV-Scanner: vulnerabilities found';
            const title = `${titlePrefix} — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## OSV-Scanner Vulnerability Report',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'OSV-Scanner found known vulnerabilities in npm dependencies. Please review the run summary (or the workflow logs) and update affected packages.',
            ].join('\n');

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
              per_page: 100,
            });
            const existing = openIssues.data.find((issue) => issue.title.startsWith(titlePrefix));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString().slice(0,10)}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependencies'],
              });
            }

  # ── Cross-repository shared-module parity ─────────────────────────────────
  # The two ServiceNow tasks' sanitizer/URI-guard modules (html-sanitizer.ts,
  # uri-scheme-guard.ts) are PROVENANCE copies of files that still live, and
  # are still deprecated-but-present, in azure-pipelines-terraform
  # (azure-pipelines-terraform#1046). Every in-repo duplication this extension
  # carries is guarded by scripts/check-shared-modules.js's byte-identity
  # FAMILIES check; a copy across a REPOSITORY boundary cannot be byte-compared
  # that way, because the upstream tree is never checked out in a normal
  # pull-request build (azure-pipelines-terraform#1112 finding 1, deferred
  # until this repository's first release -- v1.0.2 shipped 2026-08-30, so the
  # trigger is met). Until now the two copies were held in sync only by the
  # fact that every fix to either task was applied to both repositories by
  # hand.
  #
  # This job is where the second checkout the comparison needs actually
  # happens: scripts/check-cross-repo-parity.js's own self-test
  # (scripts/test-check-cross-repo-parity.js) runs on every pull request from a
  # synthetic fixture pair, in ci.yml, beside the other gate self-tests -- but
  # the REAL comparison needs azure-pipelines-terraform's tree, which only this
  # scheduled job checks out.
  #
  # STILL NOT wired into an issue-on-failure job, and as of 2026-09-09 that is
  # a narrower statement than it used to be. The original reason was that
  # issue-filing needed `security`/`dependencies` labels this repository did
  # not carry; it carries both now, and `osv-scan` above files against them.
  # What separates that job from this one is not the labels, it is the signal:
  # the shared osv-scan action distinguishes "found something" from "the
  # scanner broke", so a finding there is a well-formed thing to open a ticket
  # about. A parity divergence here has no such split -- the job either
  # compares the two trees and disagrees, or fails to check out the upstream
  # tree at all, and both arrive as the same red. Filing on that would file on
  # a checkout outage as readily as on a real divergence. So a divergence
  # still fails this job, which is this workflow's documented notification for
  # a scheduled run (see the header at the top of this file), the same way `ci`
  # notifies today. Revisit if this check ever grows a signal worth filing on.
  cross-repo-parity:
    name: Cross-repo shared-module parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The only egress this job needs is the two checkouts, both against
      # github.com, so -- unlike `ci` and `osv-scan` above -- this one runs
      # `block` rather than `audit` from its first execution: the endpoint set
      # is fully known up front rather than needing an observed baseline.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Public repository, no token: an authenticated request carrying a token
      # that has no relationship to this OTHER repository is rejected outright
      # rather than falling back to an anonymous read, so the clone has to be
      # unauthenticated. actions/checkout cannot express that: `token: ''` is
      # refused before the step runs ("Input required and not supplied: token"),
      # which is how this job failed on its first execution, 2026-09-09. A plain
      # git clone over https sends no credential at all, which is what the
      # comment above always meant. github.com:443 is already the one endpoint
      # the block policy admits, and the parity script only reads the working
      # tree, so a shallow clone of main is the whole requirement.
      - name: Clone azure-pipelines-terraform (upstream, public, anonymous)
        run: git clone --quiet --depth 1 --branch main https://github.com/sethbacon/azure-pipelines-terraform.git upstream-azure-pipelines-terraform

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Nothing here asks for a cache, but setup-node turns one on by
          # itself once package.json declares a packageManager -- silently.
          # Stated so it cannot arrive as a side effect of an unrelated edit,
          # and so it never needs an endpoint added to the block list above.
          package-manager-cache: false

      - name: Cross-repo shared-module parity
        run: node scripts/check-cross-repo-parity.js upstream-azure-pipelines-terraform
