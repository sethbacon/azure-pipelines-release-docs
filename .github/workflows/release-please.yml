---
name: Release Please

"on":
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Non-cancelling: a run that reaches the tag/release-cutting step is producing
# an external, hard-to-undo artifact and must be allowed to finish.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # block, not audit. The step immediately below mints an installation token
      # from a STORED GitHub App private key with `contents: write` and
      # `pull-requests: write` and hands it to a third-party action; audit mode
      # would have produced a log entry after the fact rather than a failed
      # connection (#23). This job installs nothing, so its egress is fixed and
      # enumerable from this file: release-please talks to the GitHub API, and
      # the runner fetches its actions. Same rule the estate already applies to
      # its credential-bearing publish jobs (4cloudguru/pipeline-task-core and
      # -ado, cloud-suite-ui, terraform-drift-contract).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RELEASE_DISPATCH_APP_KEY }}
          # Scope the token to what release-please needs rather than inheriting
          # the app's blanket installation permissions. The installation is NOT
          # granted `issues`, so requesting it 422s the token step.
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
