---
# The path a .vsix takes from a reviewed commit to the VS Marketplace.
#
# PROVENANCE. Ported from `release.yml` in the sibling extensions
# sethbacon/azure-pipelines-terraform and sethbacon/azure-pipelines-packer,
# which run the same seven-job shape: guard -> ci -> build -> package ->
# sbom-and-sign -> draft-release -> publish-marketplace -> undraft-release. The
# two siblings have drifted apart; where they differ, this file follows the side
# that is right and says which:
#
#   FROM TERRAFORM. The `concurrency` group (packer has none, so a tag push and
#   a dispatch for the same tag can race two publishes); `timeout-minutes` on
#   every job; the marketplace-environment protection self-check in `guard`; and
#   the `cosign verify-blob` integrity gate before BOTH the draft release and
#   the publish — packer signs the .vsix and then publishes without ever
#   verifying that what it downloaded in the publish job is what it signed in
#   the signing job.
#
#   FROM PACKER. `ref: refs/tags/<tag>` with `fetch-tags: true` rather than a
#   bare tag name, so a branch that happens to share a tag's name cannot win the
#   ref resolution.
#
#   NEITHER: THE DISPATCH RULE. Both siblings let `workflow_dispatch` supply an
#   arbitrary tag while the run itself checks out whatever ref it was dispatched
#   from; packer's #109 is the bug that produced — a dispatch from main with
#   post-tag commits built, signed, attested and released a commit that was not
#   the tag. They fixed it by pinning `guard`'s resolved SHA into every
#   downstream checkout. Half of that fix is unavailable here: this repository
#   reuses `ci.yml` through its `workflow_call: {}` hook, and that hook declares
#   no inputs, so the CI job cannot be told which ref to test. Rather than edit
#   ci.yml from this change, `guard` requires the dispatch to be run FROM the tag
#   (`github.ref_type == 'tag'` and the input matching it). That makes
#   `github.sha` and the guard's resolved SHA the same commit for both triggers,
#   which is the invariant the sibling fix buys — obtained by narrowing the
#   trigger rather than by threading a ref. Downstream jobs still pin the
#   resolved SHA, so a tag moved mid-run changes nothing.
#
# WHY THE JOBS ARE ORDERED THIS WAY: THE TEN-MINUTE TOKEN. The Marketplace
# publisher service principal (`tsm-azdo-marketplace-publisher`, shared with
# both siblings) carries a Microsoft Graph tokenLifetimePolicy pinning
# AccessTokenLifetime to 00:10:00 — the platform minimum, down from the ~60-90
# minute default. That single constraint decides the shape of this pipeline:
#
#   * The `marketplace` environment gate is a HUMAN approval. It can sit
#     unanswered for hours. Nothing that expires may be acquired before it.
#   * So every slow step — CI, build, package, SBOM generation, signing,
#     attestation, the draft GitHub Release — happens in the jobs BEFORE
#     publish-marketplace. By the time a reviewer approves, the artifact is
#     already built and signed; only the publish remains.
#   * Inside the gated job the token is minted in the SAME `run:` block that
#     spends it. It is never a job output, never an artifact, never an earlier
#     step: a ten-minute token handed forward is a token that has already
#     expired somewhere.
#   * scripts/publish-marketplace.js retries a transient upstream failure at
#     most PUBLISH_MAX_ATTEMPTS (4) times with a 5s exponential base — at most
#     ~35s of waiting, which fits inside ten minutes with room to spare. That
#     budget is not free to grow.
#
# THE TASKS HAVE LANDED, SO THIS IS NO LONGER INERT. This header used to record
# that the extension declared `"contributions": []` and that `tfx extension
# create` refuses to package a manifest with no contribution, so a tag pushed
# then would stop in `guard`. #71 brought both tasks in and the manifest now
# declares two contributions, so that paragraph described a repository that no
# longer exists. What it said would happen -- "the first release becomes
# possible when the first task lands" -- is what this workflow is now expected
# to do. Nothing here has run yet: no tag has ever existed (see
# .release-please-config.json), so every release to date is a draft with no
# assets. The first real run is the one that proves this path, not this comment.
name: Release

"on":
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3). Run this workflow FROM that tag, not from a branch."
        required: true

permissions:
  contents: read

# Non-cancelling: this pipeline produces external, hard-to-undo artifacts (a
# GitHub Release, a Marketplace listing). An in-flight run must finish rather
# than be killed mid-publish; a second run for the same tag queues behind it.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify the release could be correct
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
      tag: ${{ steps.resolve-sha.outputs.tag }}
    steps:
      # hardening-exception: egress-audit — release.yml has NEVER RUN. `guard` fails
      # every tag today because azure-devops-extension.json declares
      # "contributions": [] and tfx refuses to package it, so there is no audit-mode
      # record from which to derive an allowlist for any job in this file. #23 asks
      # for exactly that evidence before flipping, and guessing an allowlist onto a
      # path whose first execution is a real release trades an observed risk for an
      # unobserved outage. Derive the lists from the first release run's harden-runner
      # summaries and flip all seven jobs then; the workflow-hardening gate keeps this
      # reason in front of whoever edits the file (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Release-time, BLOCKING mirror of the check the siblings also run weekly
      # as a detective canary. This repository has no weekly-security.yml, so
      # this is the only place the `marketplace` environment's protection rules
      # are verified — which makes fail-closed error handling the only defensible
      # choice: a release must not publish past a gate it could not verify.
      - name: Verify marketplace environment protection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ENVIRONMENT = 'marketplace';
            let env;
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/environments/{environment_name}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: ENVIRONMENT,
              });
              env = response.data;
            } catch (err) {
              if (err.status === 404) {
                core.setFailed(`The '${ENVIRONMENT}' GitHub Environment does not exist — publish-marketplace references an environment with no protection rules at all.`);
                return;
              }
              core.setFailed(`Could not verify the '${ENVIRONMENT}' environment's protection rules (HTTP ${err.status ?? 'unknown'}): ${err.message}. Failing the release rather than publishing past an unverifiable gate.`);
              return;
            }

            const rules = env.protection_rules ?? [];
            const requiredReviewersRule = rules.find((rule) => rule.type === 'required_reviewers');
            const hasRequiredReviewers = Boolean(requiredReviewersRule && Array.isArray(requiredReviewersRule.reviewers) && requiredReviewersRule.reviewers.length > 0);

            if (!hasRequiredReviewers) {
              core.setFailed(
                `The '${ENVIRONMENT}' GitHub Environment has no required-reviewer protection rule configured, ` +
                `so publish-marketplace would publish to the Marketplace with no human approval. ` +
                `Configure it under Settings -> Environments -> ${ENVIRONMENT} -> Required reviewers.`
              );
              return;
            }

            // A required-reviewers rule alone still lets the publish deploy from
            // ANY ref once a reviewer approves that one run. Also require a
            // deployment branch/ref policy, so only an approved ref can reach the
            // publish. The API returns deployment_branch_policy as null when
            // unrestricted, or one of the two booleans true when a policy is set.
            const branchPolicy = env.deployment_branch_policy;
            const hasDeploymentBranchPolicy = Boolean(
              branchPolicy && (branchPolicy.protected_branches === true || branchPolicy.custom_branch_policies === true)
            );

            if (!hasDeploymentBranchPolicy) {
              core.setFailed(
                `The '${ENVIRONMENT}' GitHub Environment has no deployment branch/ref policy configured, ` +
                `so a publish could run from an unapproved ref even with reviewer approval. ` +
                `Configure it under Settings -> Environments -> ${ENVIRONMENT} -> Deployment branches and tags.`
              );
              return;
            }

            core.info(`OK: '${ENVIRONMENT}' has ${requiredReviewersRule.reviewers.length} required reviewer(s) and a deployment branch/ref policy.`);

      # See THE DISPATCH RULE in the header. Checked before the checkout, so a
      # dispatch from the wrong ref costs nothing and explains itself.
      - name: Verify a dispatch was run from the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ] || [ "$INPUT_TAG" != "$REF_NAME" ]; then
            echo "::error::This workflow was dispatched from ${REF_TYPE} '${REF_NAME}' with tag input '${INPUT_TAG}'." \
                 "ci.yml is reused through workflow_call and takes no ref input, so it tests the ref the run was" \
                 "started from. Re-run this workflow with 'Use workflow from' set to the tag '${INPUT_TAG}'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check the tag is reachable from main
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" origin/main 2>/dev/null; then
            echo "::error::Tag ${TAG} is not reachable from origin/main. Releases must be tagged on main."
            exit 1
          fi

      - name: Verify the extension version matches the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#v}"
          EXT_VERSION=$(node -p "require('./azure-devops-extension.json').version")
          if [ "$TAG_VERSION" != "$EXT_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match azure-devops-extension.json version (${EXT_VERSION}). Merge the release-please PR before tagging."
            exit 1
          fi

      # The gates that decide whether this release can be correct, and the
      # mutation self-tests that prove those gates still detect anything. A gate
      # that has quietly stopped detecting looks exactly like a clean tree, which
      # is why the self-tests run beside the gate rather than at review time.
      # (These want moving into ci.yml's already-required `manifest` job so they
      # gate a merge too; ci.yml belongs to a change landing in parallel.)
      - name: Release preconditions
        run: node scripts/check-release-readiness.js

      - name: Release-readiness gate detects what it claims to
        run: node scripts/test-release-readiness.js

      - name: Publish wrapper keeps the token off argv and bounds its retries
        run: node scripts/test-publish-marketplace.js

      # ADO agents pick up new MINOR task versions automatically; a fix that
      # ships with only a Patch bump is published to the Marketplace and never
      # reaches an agent that already cached the Major.Minor. The PR gate checks
      # this on the release PR; this checks it against the tag actually building.
      - name: Verify per-task Minor bumps
        run: node scripts/check-minor-bumps.js

      # Every downstream job checks out THIS commit rather than re-resolving the
      # tag, so a tag moved after this point cannot swap what gets published.
      - name: Resolve the validated commit
        id: resolve-sha
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: guard
    # ci.yml's zizmor job uploads SARIF, so the called workflow needs more than
    # this workflow's default `contents: read`. A called workflow can only ever
    # narrow what the caller grants, so the caller has to grant it here.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release bundle
    needs: [guard, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hardening-exception: egress-audit — same as `guard`: this workflow has never
      # run, so no audit-mode record exists to derive an allowlist from. This job also
      # runs `npm ci` and the per-task installs, whose destinations are npm's registry
      # and CDN rather than a set this file can enumerate (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Nothing here asks for a cache, but setup-node turns one on by itself
          # once package.json declares a packageManager -- silently, in the jobs
          # that build and sign the published .vsix. Stated so it cannot arrive
          # as a side effect of an unrelated edit.
          package-manager-cache: false
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Build release
        run: npm run build:release
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: build/
          retention-days: 1

  package:
    name: Package extension (.vsix)
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hardening-exception: egress-audit — same as `guard`: no audit-mode record
      # exists yet, and this job runs `npm ci` plus `tfx extension create`, whose
      # egress is npm's and Microsoft's to change rather than this file's (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Nothing here asks for a cache, but setup-node turns one on by itself
          # once package.json declares a packageManager -- silently, in the jobs
          # that build and sign the published .vsix. Stated so it cannot arrive
          # as a side effect of an unrelated edit.
          package-manager-cache: false
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: build/
      - name: Package extension
        run: npm run package:release
      - name: Upload vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 7

  sbom-and-sign:
    name: Generate SBOM and sign the .vsix
    needs: [guard, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write # required by attest-build-provenance / attest
    steps:
      # hardening-exception: egress-audit — this is the job an allowlist is most worth
      # having on: it holds id-token and attestations write. It stays on audit for one
      # reason only, and it is the reason #23 itself gives — this workflow has never
      # run, so the Sigstore, npm and attestation endpoints would be copied from a
      # sibling rather than observed here. The sibling list to start from is recorded
      # in 4cloudguru/pipeline-task-core's publish.yml (fulcio, rekor, tuf-repo-cdn,
      # registry.npmjs.org, api.github.com); confirm it against this job's first real
      # run and flip it then (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Nothing here asks for a cache, but setup-node turns one on by itself
          # once package.json declares a packageManager -- silently, in the jobs
          # that build and sign the published .vsix. Stated so it cannot arrive
          # as a side effect of an unrelated edit.
          package-manager-cache: false
      # --ignore-scripts: this job holds id-token/attestations:write. tfx-cli and
      # @cyclonedx/cyclonedx-npm are pure JS and need no lifecycle scripts to
      # run; skipping them denies a compromised transitive dependency (a routine
      # lockfile bump, say) code execution in this privileged context. Ported
      # from the siblings, where it is sethbacon/azure-pipelines-packer#102.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      # The extension-level SBOM: the production closure of the packaged
      # extension itself. It is generated with `--omit dev` deliberately, so it
      # describes what SHIPS and not the build tooling. The per-task SBOMs below
      # sit on top of it: the .vsix carries root-level content as well as the
      # tasks, and scripts/check-release-readiness.js requires both shapes —
      # every task named by an `--output-file`, and one SBOM that is not a task's.
      - name: Generate the extension SBOM
        run: npx --no-install cyclonedx-npm --output-file sbom-extension.cdx.json --omit dev

      # One pair per task, the shape both sibling extensions carry. Each task is
      # an independent npm package with its own lockfile, so the extension SBOM
      # above does not describe it: without these, the two tasks' dependency
      # closures ship undescribed while SECURITY.md claims `sbom-attestation:
      # enforced` (#83). Installed with --omit=dev so the SBOM is the closure
      # that ships, not the one that builds it.
      - name: Generate the Markdown2HtmlV1 SBOM
        run: |
          cd Tasks/Markdown2Html/Markdown2HtmlV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-markdown2htmlv1.cdx.json --omit dev
      - name: Generate the PublishKbArticleV1 SBOM
        run: |
          cd Tasks/PublishKbArticle/PublishKbArticleV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-publishkbarticlev1.cdx.json --omit dev

      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the .vsix with keyless cosign
        run: |
          set -euo pipefail
          VSIX_FILE=$(find . -maxdepth 1 -name "*.vsix" -print -quit)
          cosign sign-blob --yes "$VSIX_FILE" --bundle "${VSIX_FILE}.bundle"

      # GitHub-native build provenance + SBOM attestation for the published
      # .vsix. Verifiable with:
      #   gh attestation verify <file.vsix> --repo sethbacon/azure-pipelines-release-docs
      - name: Attest build provenance for the .vsix
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.vsix"
      - name: Attest the extension SBOM for the .vsix
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-extension.cdx.json"
      # An SBOM generated and not attested travels with the release as an
      # unsigned file rather than a verifiable claim about the .vsix, so the
      # readiness gate requires the pair in both directions.
      - name: Attest the Markdown2HtmlV1 SBOM for the .vsix
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-markdown2htmlv1.cdx.json"
      - name: Attest the PublishKbArticleV1 SBOM for the .vsix
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-publishkbarticlev1.cdx.json"

      - name: Upload SBOM and signature artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-signatures
          path: |
            sbom-*.cdx.json
            *.vsix.bundle
          retention-days: 7

  draft-release:
    name: Create the draft GitHub Release
    needs: [guard, package, sbom-and-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      # hardening-exception: egress-audit — same as `guard`: no observed egress record
      # exists for this workflow yet. This job downloads artifacts, installs cosign
      # from a GitHub release and verifies against Rekor before creating the draft
      # (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - name: Download SBOM and signature artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-and-signatures
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The same integrity gate publish-marketplace runs, applied before the
      # artifact is attached to a GitHub Release, so the release never
      # distributes bytes that fail verification. The release stays a draft until
      # the publish succeeds, so a failure here blocks publication too.
      - name: Verify the .vsix signature before releasing
        run: |
          set -euo pipefail
          VSIX_FILE=$(find . -maxdepth 1 -name "*.vsix" -print -quit)
          cosign verify-blob \
            --bundle "${VSIX_FILE}.bundle" \
            --certificate-identity-regexp '^https://github\.com/sethbacon/azure-pipelines-release-docs/\.github/workflows/release\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$VSIX_FILE"
      # release-please already created this tag's Release as a draft, with the
      # CHANGELOG as its body (.release-please-config.json sets draft +
      # force-tag-creation). Only the artifacts are missing, so upload into it.
      # The action this replaced passed generate_release_notes, which asks GitHub
      # to synthesise notes over the top of that curated body.
      - name: Attach the signed artifacts to the draft Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "Artifacts for ${TAG}."
          fi
          # ./ on each glob: a file whose name begins with a dash would otherwise
          # be read by gh as an option (shellcheck SC2035).
          gh release upload "$TAG" ./*.vsix ./sbom-*.cdx.json ./*.vsix.bundle --clobber
          # The list endpoint is the one that returns drafts; releases/tags/<tag>
          # does not, and undraft needs this id.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                 --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1)
          [ -n "$id" ] || { echo "no release found for ${TAG}" >&2; exit 1; }
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  publish-marketplace:
    name: Publish to the VS Marketplace
    needs: [guard, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # THE GATE. A human approves before anything below runs, and the
    # environment's deployment branch/ref policy limits which refs may reach it.
    # guard re-verified both at the start of this run.
    environment: marketplace
    permissions:
      id-token: write # GitHub OIDC -> Microsoft Entra federated credential
      contents: read
    steps:
      # hardening-exception: egress-audit — the Marketplace publish reaches Entra
      # (login.microsoftonline.com), the Azure DevOps resource app and the Marketplace
      # itself through tfx-cli, none of which this workflow has ever contacted. A
      # guessed allowlist here fails a release AFTER a human has approved the
      # environment gate and while a ten-minute token is burning. Derive it from the
      # first run and flip it then (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Nothing here asks for a cache, but setup-node turns one on by itself
          # once package.json declares a packageManager -- silently, in the jobs
          # that build and sign the published .vsix. Stated so it cannot arrive
          # as a side effect of an unrelated edit.
          package-manager-cache: false
      # --ignore-scripts: this job holds id-token:write for the Entra federated
      # credential. tfx-cli is pure JS and needs no lifecycle scripts; skipping
      # them denies a compromised transitive dependency code execution alongside
      # the token-minting step below.
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      # Re-download the cosign bundle sbom-and-sign produced over the exact .vsix
      # bytes, so the gate below verifies the SAME bytes that are about to be
      # published rather than merely that some valid signature exists somewhere.
      - name: Download SBOM and signature artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-and-signatures
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Integrity gate, and the reason it runs BEFORE azure/login: everything
      # slow happens while no token is held. An artifact substituted between jobs
      # — a compromised download step, an artifact-store isolation failure —
      # fails the release here instead of reaching the Marketplace. `--bundle`
      # carries the certificate and the Rekor entry, so verification needs no
      # id-token of its own.
      - name: Verify the .vsix signature before publishing
        run: |
          set -euo pipefail
          VSIX_FILE=$(find . -maxdepth 1 -name "*.vsix" -print -quit)
          cosign verify-blob \
            --bundle "${VSIX_FILE}.bundle" \
            --certificate-identity-regexp '^https://github\.com/sethbacon/azure-pipelines-release-docs/\.github/workflows/release\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$VSIX_FILE"
      # Authenticate to Microsoft Entra via GitHub OIDC (federated credential) —
      # no stored secret, and nothing here to rotate. The service principal is a
      # member of the 'sethbacon' Marketplace publisher and is shared with both
      # sibling extensions; it replaces the long-lived, full-scoped TFX_PAT the
      # family used to publish with.
      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZDO_PUBLISH_CLIENT_ID }}
          tenant-id: ${{ vars.AZDO_PUBLISH_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish the extension with a Microsoft Entra token
        # The token is minted and spent in this one step. Its lifetime is capped
        # at ten minutes by a tokenLifetimePolicy on the service principal, so it
        # must not be acquired in an earlier job, an earlier step, or before the
        # environment approval that may have held this run for hours.
        #
        # scripts/publish-marketplace.js keeps the token on stdin (tfx-cli reads
        # it from its masked prompt when --auth-type pat is given without
        # --token), so it never reaches /proc/<pid>/cmdline or `ps` — CWE-214 —
        # and retries a transient upstream failure a bounded number of times: the
        # packer extension lost its v1.2.7 release to a single HTTP 503 here and
        # left an orphaned draft release behind. A deterministic rejection (bad
        # manifest, auth failure, duplicate version on the first attempt) is
        # never retried. Behaviour gated by scripts/test-publish-marketplace.js,
        # which runs in guard.
        env:
          VARS_AZDO_PUBLISH_TENANT_ID: ${{ vars.AZDO_PUBLISH_TENANT_ID }}
        run: |
          set -euo pipefail
          VSIX_FILE=$(find . -maxdepth 1 -name "*.vsix" -print -quit)
          # 499b84ac-1321-427f-aa17-267ca6975798 is the Azure DevOps resource app.
          MARKETPLACE_TOKEN=$(az account get-access-token \
            --tenant "${VARS_AZDO_PUBLISH_TENANT_ID}" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)
          # Mask the runtime-minted token so it is redacted from any log output.
          echo "::add-mask::$MARKETPLACE_TOKEN"
          export MARKETPLACE_TOKEN
          node scripts/publish-marketplace.js --vsix "$VSIX_FILE"

  undraft-release:
    name: Undraft the GitHub Release
    needs: [draft-release, publish-marketplace]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # hardening-exception: egress-audit — same as `guard`: no observed egress record
      # exists for this workflow yet. This job runs one github-script call against the
      # API and is the cheapest of the seven to flip once that record exists (#23).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Undraft the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.draft-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false
            });
