---
# Delegates to the shared definition in 4cloudguru/shared-workflows.
#
# This repository was the LAST of the seventeen to convert, and deliberately so:
# it was the only one whose copy was stricter than the shared definition, in
# three separate ways. Converting it first would have regressed it. Each was
# carried UP instead, and this file is the last step rather than the first:
#
#   1. It revoked the security-orchestration read token before running any
#      repo-committed gate script (#32). Fifteen others ran all of them with a
#      live credential. -> shared v1.8.0.
#   2. It redacted the replay report AND the job log before publishing either
#      (#24). Fifteen others published raw site lists from public repositories.
#      -> shared v1.9.0.
#   3. Its redactor had a mutation self-test. -> now in security-orchestration's
#      harness, where `unittest discover` cannot silently skip it.
#
# scripts/redact-replay-report.js and its test are DELETED here rather than kept
# in parallel: the redactor now lives beside replay.py in security-orchestration,
# which this workflow already checks out, and two copies of a fail-closed
# security control is how one of them quietly stops matching the other.
#
# TRIGGERS AND CONCURRENCY STAY HERE. Concurrency must NOT also be declared in
# the shared definition -- a called workflow sharing its caller's group queues
# behind the caller and the run never starts, with no jobs and no annotation.
#
# PINNED BY SHA. `vars.SUITE_READ_APP_ID` resolves against THIS repository.
name: signature-replay

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signature-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    uses: 4cloudguru/shared-workflows/.github/workflows/signature-replay.yml@3aae0966a70daa50bcfe741ef07e20e86c814af4 # v1.20.2
    # Exactly one secret, named. NOT `secrets: inherit`.
    secrets:
      SUITE_READ_APP_KEY: ${{ secrets.SUITE_READ_APP_KEY }}
