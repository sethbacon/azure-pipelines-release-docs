# Signature replay — the PER-REPO, merge-blocking half of the gate.
#
# WHY THIS REPO HOSTS IT WHILE NO SIGNATURE READS IT YET. This extension joined
# SIGNATURE_SCOPE under a SIGNATURE-FREE kind (security-orchestration#55). It is
# still a scaffold with no Tasks/ tree, and pointing the thirteen `ado-extension`
# signatures at an empty task surface would make every one of them enumerate
# nothing and exit 2 — which is could-not-run, never clean. Being in scope is
# what buys the rest: check 2 (consumer pin freshness) can read this repo's
# manifests the day it starts depending on @4cloudguru/pipeline-task-core or
# @4cloudguru/pipeline-task-ado, and the day Markdown2HtmlV1 and
# PublishKbArticleV1 land here the kind flips to `ado-extension` in scope.json
# alone — one line, no workflow change in any host repo, because every host
# already checks this repo out.
#
# COST OF THIS FORM, already accepted everywhere else in the estate: the ledger
# and the signatures live in the PRIVATE security-orchestration repo, so this
# repo needs a credential that can read it. What it buys is the ability to BLOCK
# a bad merge, which the central scheduled copy cannot.
#
# That credential is the smallest thing that closes the gap. Every OTHER repo the
# replay reads is public, so its checkout runs on this job's own GITHUB_TOKEN and
# takes no distributed secret at all — and so do the `gh` calls behind
# --verify-linked-issues, whose linkages all point at public repos. The stored
# secret is a GitHub App private KEY that mints an hour-long token for ONE step,
# narrowed by `repositories:` to the one repo it reads and by
# `permission-contents: read` to the one thing it does there.
#
# Exit codes are not symmetrical: 1 means a signature ran and found something, 2
# means a signature could not run at all. Two is never a pass, which is why every
# checkout below is load-bearing rather than convenience.
#
# THE CREDENTIAL IS ALIVE FOR EXACTLY ONE STEP. It is minted, spent on the one
# checkout it exists for, and then explicitly REVOKED — before the commit under
# test enters the analysed tree and before any signature shells out to a
# checked-out repository's own committed gate scripts. Six of the thirteen
# ado-extension signatures do exactly that, so the alternative was fifteen
# repositories' code running beside a live cross-repo installation token, held
# off by a `kind` value in a file in another repository (#32). The revoke step
# then spends the dead token and fails the job if it still works, so the
# property is asserted on every run rather than assumed.
#
# WHAT THIS FILE STILL CANNOT DO. `replay` is a required check and cannot go
# green on a Dependabot PR or a fork PR: those runs read the Dependabot secret
# store or no store at all, `secrets.SUITE_READ_APP_KEY` resolves empty, and the
# token step fails before anything runs. That is not fixable in one repository.
# Mirroring the App private key into the Dependabot store is the obvious move
# and the wrong one — `pull_request` runs the workflow file from the PR head and
# Dependabot edits workflow files — so the estate is choosing between three
# options in sethbacon/azure-pipelines-packer#263, and every host of this file
# has to land the same one. Tracked here as #31; do not resolve it locally.
#
# ADDING THIS FILE WAS NOT ENFORCEMENT, AND THE REST HAS SINCE LANDED. `replay`
# also had to be added to main's required_status_checks, pinned to app 15368
# (GitHub Actions), and only AFTER a run on this repo proved the context reports
# — a required context that never posts blocks every merge instead. That step is
# done: `replay` is now one of main's required contexts, so this workflow does
# block a merge here. The paragraph this replaces still said the opposite, and
# said it for as long as the settings change went unrecorded: the same
# documentation-overclaim class as #19, pointing the other way.

name: signature-replay

on:
  pull_request:
  push:
    branches: [main]
  # Check 2, and the "new instance written since the fix" case, depend on time
  # passing rather than on anyone opening a PR.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# `github.event_name` is in the group because `github.ref` alone does not tell a
# scheduled run from a push to main — both are refs/heads/main, so the two shared
# one group and cancelled each other (#35). ci.yml in this same repository
# already groups this way. And cancel-in-progress is narrowed to pull_request
# for the reason the header gives for having a schedule at all: check 2 and the
# "new instance written since the fix" case depend on time passing, and a
# cancelled run is neither the exit 1 that means a signature found something nor
# the exit 2 that means it could not run. Only a superseded PR run is safe to
# discard.
concurrency:
  group: signature-replay-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    runs-on: ubuntu-latest
    # This job checks out fifteen repositories, runs each one's OWN committed
    # gate scripts, and mints a GitHub App token on the way. It was the only job
    # in the repository with neither a timeout nor harden-runner (#22): without a
    # bound, a stalled replay holds the runner — and anything it minted — for the
    # platform default of six hours. Thirty minutes is roughly triple a normal
    # run.
    timeout-minutes: 30
    # Nothing is checked out at the workspace root — every checkout below lands
    # under suite/ — so this repository's own gate scripts are reached through
    # its suite path, which is the literal `path:` its checkout uses. On a
    # pull_request the self-overwrite step replaces that tree with the commit
    # under test, so the redactor that runs is the one being reviewed, exactly
    # like every other gate in this repository.
    env:
      SELF: suite/azure-pipelines-release-docs
    steps:
      # block, not audit, and this is the job #22 named as the best candidate for
      # it in the whole repository: it executes foreign code from fifteen repos.
      # Every destination below is derivable from this file — the checkouts and
      # the `gh` calls go to GitHub, and the three setup-* actions fetch their
      # toolchains and the Go module cache. Nothing here resolves a dependency
      # tree, so unlike ci.yml's build job the set does not move under us (#23).
      #
      # If a legitimate destination is missing, harden-runner names it in the run
      # summary as a blocked connection. Add it here with a reason; do not
      # downgrade the policy.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            storage.googleapis.com:443
            sum.golang.org:443

      # Every repo in SIGNATURE_SCOPE must be present. A signature that cannot
      # run against a repo establishes nothing about it, and the job exits 2
      # rather than pretending otherwise — so these checkouts are load-bearing,
      # not convenience.
      #
      # All of them are PUBLIC, so none takes a `token:` — actions/checkout falls
      # back to the job's own GITHUB_TOKEN, which reads public repositories
      # anywhere. Handing these a credential-to-a-private-repo bought nothing and
      # put it in more places.
      #
      # persist-credentials: false on EVERY checkout, the tokenless ones included.
      # Without it, actions/checkout leaves whatever credential it used in that
      # clone's .git/config, inside a job that also uploads an artifact. That is
      # zizmor's `artipacked` audit, and it is not theoretical: widen the upload
      # path by one glob and the credential ships with the report. The replay only
      # READS these trees; nothing after the checkouts needs git credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/terraform-registry-backend,
            path: suite/terraform-registry-backend,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/terraform-state-manager-backend,
            path: suite/terraform-state-manager-backend,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/terraform-registry-frontend,
            path: suite/terraform-registry-frontend,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/terraform-state-manager-frontend,
            path: suite/terraform-state-manager-frontend,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/terraform-suite-identity,
            path: suite/terraform-suite-identity,
          }
      # `path` is the OLD name on purpose: scope.json's `dir` is what
      # `--repos-root suite` resolves against, and renaming the repo did not
      # rename the scope entry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: 4cloudguru/cloud-suite-ui,
            path: suite/terraform-suite-ui,
          }
      # The two ADO extensions are siblings that COPY modules between each other
      # rather than sharing a versioned one, so a class found in either is
      # presumed in the other and every signature runs in both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/azure-pipelines-packer,
            path: suite/azure-pipelines-packer,
          }

      # The THIRD ADO extension, and today a scaffold: it has no Tasks/ tree, so
      # scope.json gives it a signature-free kind and no `ado-extension`
      # signature is pointed at an empty task surface (that would be exit 2, and
      # exit 2 is could-not-run, never clean). It is in SIGNATURE_SCOPE all the
      # same, and in scope.json but absent here is exit 2 for the whole job
      # rather than a quieter run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/azure-pipelines-release-docs,
            path: suite/azure-pipelines-release-docs,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/azure-pipelines-terraform,
            path: suite/azure-pipelines-terraform,
          }
      # The GitHub-Actions family, added to SIGNATURE_SCOPE in 2026-08: two
      # composite actions whose whole implementation is shell in action.yml, two
      # node actions that ship TypeScript plus a committed dist/, and the drift
      # payload contract they and the ADO TerraformDriftReport task share. Same
      # rule as every checkout above — in scope.json and absent here is exit 2 for
      # the whole job, not a quieter run. Note the OWNER: drift-contract is in the
      # 4cloudguru org, not sethbacon. Both orgs' repos are public, so this job's
      # own GITHUB_TOKEN still reads them, but the slug is not interchangeable.
      # Each path basename must equal that repo's `dir` in scope.json, which is
      # what `--repos-root suite` resolves against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/setup-terraform-hardened,
            path: suite/setup-terraform-hardened,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/terraform-provider-mirror,
            path: suite/terraform-provider-mirror,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/terraform-drift-report,
            path: suite/terraform-drift-report,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: sethbacon/terraform-module-publish,
            path: suite/terraform-module-publish,
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: 4cloudguru/terraform-drift-contract,
            path: suite/terraform-drift-contract,
          }

      # This repo. The self-overwrite step below replaces it with the commit
      # under test on a pull_request, so the replay reads the PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: 4cloudguru/pipeline-task-ado,
            path: suite/pipeline-task-ado,
          }
      # The sibling shared package. Both extensions consume BOTH packages, so a
      # pin-freshness check that could not read this one would report a stale
      # consumer as clean.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          {
            persist-credentials: false,
            repository: 4cloudguru/pipeline-task-core,
            path: suite/pipeline-task-core,
          }

      # The one private repo, and so the one credential. `owner:` is load-bearing
      # rather than cosmetic: an app token is minted per INSTALLATION, and this
      # file also runs from a repo in another org, where the default — the running
      # repo's owner — would mint a token that cannot see this repo at all.
      # `repositories:` narrows the minted token to the single repo it is spent
      # on, and `permission-contents: read` narrows what it may do there: without
      # it the token inherits every permission the app installation holds, which
      # is zizmor's `github-app-token` audit and is how a read-only intention
      # becomes a write-capable credential the day someone widens the app.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: suite-read
        with:
          app-id: "${{ vars.SUITE_READ_APP_ID }}"
          private-key: "${{ secrets.SUITE_READ_APP_KEY }}"
          owner: sethbacon
          repositories: security-orchestration
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: sethbacon/security-orchestration
          token: "${{ steps.suite-read.outputs.token }}"
          path: security-orchestration

      # ── THE CREDENTIAL'S LIFE ENDS HERE ──────────────────────────────────
      # Six of the thirteen ado-extension signatures are ADAPTERS: they shell
      # out to each checked-out repository's OWN committed scripts/check-*.js.
      # That is repo-committed code from fifteen repositories — and, on a
      # pull_request, from the commit under review — executing in this job. It
      # used to execute while this job held a live cross-repo installation token
      # for the private security-orchestration repo, and the only thing stopping
      # it was a `kind` value in a file in ANOTHER repository: flip scope.json's
      # one line from `ado-extension-scaffold` to `ado-extension` and the code
      # runs, with no change to any workflow in any host repo (#32).
      #
      # The token has done everything it is for by this point — the checkout
      # above is its only consumer — so it is revoked HERE rather than left to
      # the action's post-job cleanup. Everything below this step runs with a
      # dead credential.
      #
      # The second half of the step is the proof, and it runs on every replay
      # rather than at review time: it spends the revoked token against the one
      # repository it was minted for and fails the job if that still works. A
      # revocation nobody tests is a revocation that stops happening.
      - name: Revoke the installation token before any repo-committed code runs
        if: steps.suite-read.outputs.token != ''
        env:
          SUITE_READ_TOKEN: "${{ steps.suite-read.outputs.token }}"
        run: |
          set -euo pipefail
          revoked=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${SUITE_READ_TOKEN}" \
            https://api.github.com/installation/token)
          if [ "$revoked" != "204" ]; then
            echo "::error::Revoking the security-orchestration installation token returned HTTP ${revoked}, not 204." \
                 "The replay runs repo-committed gate scripts from fifteen repositories and must not do so while that" \
                 "token is live (#32)."
            exit 1
          fi
          still_reads=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${SUITE_READ_TOKEN}" \
            https://api.github.com/repos/sethbacon/security-orchestration)
          if [ "$still_reads" = "200" ]; then
            echo "::error::The installation token still reads sethbacon/security-orchestration after a 204 from" \
                 "DELETE /installation/token. The revocation above is not doing what this job depends on it doing."
            exit 1
          fi
          echo "Installation token revoked (DELETE 204) and confirmed dead (GET ${still_reads}); everything below runs uncredentialed."

      # NOW the commit under test enters the analysed tree — after the token is
      # gone, not before. Guarded because `github.event.repository` is absent on
      # schedule events: the path would collapse to `suite/` and dump this repo
      # into the suite root. A scheduled run wants origin/main anyway, which the
      # explicit checkout above already fetched.
      #
      # Deliberately NOT restricted to same-repository pull requests. A fork PR
      # replayed against origin/main's copy of this repo would report on code it
      # never read, and a required check that answers about the wrong tree is
      # worse than one that cannot answer at all. The revocation above is the
      # control; the checkout guard would only have been a way of not looking.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'schedule'
        with:
          persist-credentials: false
          clean: false
          path: suite/${{ github.event.repository.name }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The credential-lifecycle signature is a type-aware Go analyzer; the
      # replay invokes it with `go run` from its own module directory.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: security-orchestration/remediation/signatures/credlifecycle/go.mod
          cache-dependency-path: security-orchestration/remediation/signatures/credlifecycle/go.sum

      # Every ado-extension signature is node: premask-emission.cjs and
      # output-boundary.cjs are node analysers, and the other six shell out to
      # each extension's OWN committed gate
      # (scripts/check-egress-authorization.js, scripts/auth-parity-matrix.cjs,
      # scripts/check-artifact-trust.js, scripts/check-enforced-disciplines.js,
      # scripts/check-proxy-parity.js, scripts/check-docs-claims.js) so the
      # replay and that repo's CI cannot answer differently about the same code.
      # `rg` and `ast-grep` are deliberately unused: neither exists in a
      # non-interactive shell here and both exit 127, which reads as
      # "no matches".
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Runs before the replay, not after: a redactor that has quietly stopped
      # redacting produces output indistinguishable from a correct one, and by
      # the time anyone notices it has already been published from a public
      # repository. This plants site strings, redacts, and asserts none survive.
      - name: The report redactor still redacts
        run: node "$SELF/scripts/test-redact-replay-report.js"

      # ── WHAT THIS REPOSITORY MAY PUBLISH ─────────────────────────────────
      # replay.py emits, per tracked issue, the `regressed` and `unaddressed`
      # SITES — file locations across fifteen repositories that the estate knows
      # are defective and has not fixed — plus the full `matched` universe. This
      # repository is PUBLIC, so both the artifact and this log are readable by
      # anyone (#24). Fourteen of the fifteen scanned repos are public too, so
      # the code is not the secret; the curated "known-bad and still unfixed"
      # list is.
      #
      # The report is not deleted, because a required merge-blocking check whose
      # output nobody keeps cannot be audited: a signature that enumerated
      # nothing exits clean and looks exactly like one that enumerated
      # everything. `ran_in`, `skipped`, `caveats` and the per-set counts are
      # what tell those apart, and they are kept in full. Only the site lists go.
      #
      # stdout is captured rather than streamed for the same reason: #24's own
      # recommendation was to read the findings from this log instead of the
      # artifact, and on a public repository that is the same disclosure by
      # another route. Both surfaces are redacted, or neither is.
      #
      # A gate error (exit 2) writes no --json and prints to stderr, which is not
      # captured — an error message is not site data and stays visible.
      #
      # --verify-linked-issues: a CLOSED linked issue stops absorbing residual.
      # Every issue the ledger links to is in a PUBLIC repo, which GITHUB_TOKEN
      # reads without help; the app token is not needed here, is not given, and
      # by this point no longer exists.
      # Link an issue in a private repo and this fails loudly as a GATE ERROR
      # rather than assuming open — at which point widen the credential, not the
      # assumption.
      - name: Replay recorded signatures
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          status=0
          python security-orchestration/remediation/replay/replay.py \
            --ledger security-orchestration/remediation/signatures/ledger.json \
            --repos-root suite \
            --verify-linked-issues \
            --json replay-report.raw.json > replay-report.raw.txt || status=$?
          node "$SELF/scripts/redact-replay-report.js" \
            --in-text replay-report.raw.txt \
            --in-json replay-report.raw.json \
            --out-text replay-report.txt \
            --out-json replay-report.json \
            --status "$status"
          rm -f replay-report.raw.txt replay-report.raw.json
          cat replay-report.txt
          exit "$status"

      # Belt and braces on the revocation above: if the job died between minting
      # the token and revoking it, this is the only thing that shortens its life
      # from an hour to this job's runtime. Silent when it has already been
      # revoked, which is the normal case.
      - name: Ensure the installation token is revoked
        if: always() && steps.suite-read.outputs.token != ''
        env:
          SUITE_READ_TOKEN: "${{ steps.suite-read.outputs.token }}"
        run: |
          curl -sS -o /dev/null -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${SUITE_READ_TOKEN}" \
            https://api.github.com/installation/token || true

      # Exit 1 or 2 already failed the replay step; this keeps the REDACTED
      # machine-readable report for the run someone will actually want to read.
      # `retention-days` is explicit and short: the redaction is what makes this
      # publishable at all, and a bounded window is the second control rather
      # than the first one. There is no third — Actions artifacts inherit
      # repository read access, and no per-artifact ACL exists to reach for.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signature-replay-report
          path: |
            replay-report.json
            replay-report.txt
          retention-days: 7
          if-no-files-found: warn
