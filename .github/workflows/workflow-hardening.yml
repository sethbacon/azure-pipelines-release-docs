---
# Workflow-hardening gate, delegated to 4cloudguru/shared-workflows.
#
# Asserts four properties are ENFORCED rather than conventionally held: every
# `uses:` pinned to a full SHA and labelled with the version that SHA is, every
# job bounded by a timeout, harden-runner running first, and npm installs
# refusing dependency scripts.
#
# This repository used to run a 462-line local copy of the checker, and its own
# mutation self-test for it -- which was the only test of that gate anywhere,
# while the gate three extensions actually run is the shared one. Both moved
# upstream in v1.13.0: the test now sits beside the checker it proves, and this
# repository runs the same checker as its siblings instead of a fork of it.
#
# script-ref MUST equal the pin on the `uses:` line: the checker is taken from
# shared-workflows at that commit, so this repo cannot weaken its own gate by
# editing a local copy -- there is no local copy.
name: Workflow Hardening

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-hardening-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-hardening:
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-hardening.yml@a53b685c1f50255e5bc7061b6080d2456351b9be # v1.18.0
    with:
      script-ref: a53b685c1f50255e5bc7061b6080d2456351b9be
