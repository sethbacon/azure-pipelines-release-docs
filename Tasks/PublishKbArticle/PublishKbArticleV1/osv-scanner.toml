# GHSA-vwc7-r8mq-g2x9 (adm-zip, moderate) -- accepted, no fix exists to take.
# Reached transitively through azure-pipelines-task-lib, which declares
# adm-zip ^0.6.0. There is nothing to bump to: the advisory records
# first_patched_version = none, 0.6.0 is the latest release, and the upstream
# fix (cthackers/adm-zip#575) is still open -- an "overrides" entry cannot
# point at a version that does not exist, which is why this task's existing
# "adm-zip": "^0.6.0" override holds the newest thing published rather than a
# fix. The exposure here is nil rather than merely unlikely: the Node
# azure-pipelines-task-lib package never loads adm-zip at all (zero references
# in any shipped file of the installed 5.279.0 package -- only its
# package.json names it), because the dependency belongs to task-lib's
# PowerShell library, which these tasks do not ship -- see
# microsoft/azure-pipelines-task-lib#1202. Nor does anything here reach it by
# another route: no task in this extension extracts an archive, and no source
# file requires adm-zip or any other unzip path.
#
# THIS FILE SITS BESIDE THE LOCKFILE IT COVERS, not at the repository root: a
# root toml does not reach nested lockfiles under --recursive, so each task
# directory that has a package-lock.json carries its own copy.
#
# Bounded, not open-ended, and deliberately shorter than the estate's uuid
# suppressions in the sibling extensions because a fix is actively in progress
# upstream. Re-evaluate at expiry or when adm-zip > 0.6.0 ships, whichever
# comes first -- see SECURITY.md's "Residual risks" section.
[[IgnoredVulns]]
id = "GHSA-vwc7-r8mq-g2x9"
ignoreUntil = 2026-12-31
reason = "adm-zip via azure-pipelines-task-lib ^0.6.0; no patched version exists (advisory first_patched_version: none; upstream fix cthackers/adm-zip#575 open); the Node task-lib never loads adm-zip (zero references in any shipped file -- it belongs to task-lib's PowerShell half, microsoft/azure-pipelines-task-lib#1202) and tool-lib's extractZip shells out to PowerShell/unzip; re-evaluate at expiry or when adm-zip > 0.6.0 ships, whichever is first"
